name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # 检查是否需要构建 Python Lambda 镜像
  check-image-changes:
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.check.outputs.image_changed }}
      backend_changed: ${{ steps.check.outputs.backend_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 需要覆盖一次 push 中的全部提交，不能只比较最后两个提交。
          fetch-depth: 0

      - name: Check for online-praat-analysis changes
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              CHANGED_FILES=$(git ls-tree -r --name-only "${{ github.sha }}")
            else
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}")
            fi

            if grep -Eq '^(lambda-functions/|infra/|scripts/seed-reading-passages\.mjs$|package(-lock)?\.json$|\.github/workflows/(deploy-backend|build-python-lambda)\.yml$)' <<< "$CHANGED_FILES"; then
              echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_changed=true" >> $GITHUB_OUTPUT
            echo "Manual deployment requested, will rebuild Python image"
          elif grep -q "^lambda-functions/online-praat-analysis/" <<< "$CHANGED_FILES"; then
            echo "image_changed=true" >> $GITHUB_OUTPUT
            echo "Python Lambda files changed, will build image"
          else
            echo "image_changed=false" >> $GITHUB_OUTPUT
            echo "No Python Lambda changes detected"
          fi

  # 所有后端写入前先验证 Lambda、API 契约与基础设施声明。
  verify:
    needs: check-image-changes
    if: needs.check-image-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend and infrastructure sources
        run: npm run lint

      - name: Run backend unit and contract-isolation tests
        run: >-
          npx vitest run
          tests/unit/lambda
          tests/unit/scripts
          tests/unit/rateLimiter.test.js
          tests/unit/reading-passages-infra.test.js
          tests/unit/storage-cleanup-infra.test.js
          tests/integration/api

  # 构建 Python Lambda 镜像（仅在代码变化时）
  build-python-image:
    needs: [check-image-changes, verify]
    if: needs.check-image-changes.outputs.image_changed == 'true' && needs.verify.result == 'success'
    uses: ./.github/workflows/build-python-lambda.yml
    with:
      publish: true
    secrets: inherit

  # 部署后端（等待镜像构建完成，如果需要的话）
  deploy:
    needs: [check-image-changes, verify, build-python-image]
    # 无论 build-python-image 是否运行，都执行部署
    if: >-
      always() &&
      needs.check-image-changes.outputs.backend_changed == 'true' &&
      needs.verify.result == 'success' &&
      !failure() &&
      !cancelled()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate SAM template
        working-directory: ./infra
        run: sam validate --template template-production.yaml

      - name: Build SAM application
        working-directory: ./infra
        run: sam build --template template-production.yaml

      - name: Deploy to AWS
        working-directory: ./infra
        run: |
          sam deploy \
            --stack-name ${{ secrets.STACK_NAME }} \
            --parameter-overrides Environment=dev \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }}

      - name: Publish verified Python Lambda image
        if: needs.check-image-changes.outputs.image_changed == 'true'
        env:
          IMAGE_URI: ${{ needs.build-python-image.outputs.image_uri }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_URI"
          aws lambda update-function-code \
            --function-name online-praat-analysis \
            --image-uri "$IMAGE_URI" \
            --region ${{ secrets.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name online-praat-analysis \
            --region ${{ secrets.AWS_REGION }}

      - name: Install reading-passage seed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Seed default reading passages
        run: node scripts/seed-reading-passages.mjs
        env:
          READING_PASSAGES_TABLE_NAME: VoiceFemReadingPassages

      - name: Output deployment info
        working-directory: ./infra
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack:** ${{ secrets.STACK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get outputs from stack
          echo "### Stack Outputs" >> $GITHUB_STEP_SUMMARY
          aws cloudformation describe-stacks \
            --stack-name ${{ secrets.STACK_NAME }} \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not retrieve outputs" >> $GITHUB_STEP_SUMMARY
          
          # Check if new API Gateway was created
          NEW_API_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ secrets.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$NEW_API_ID" ] && [ "$NEW_API_ID" != "None" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ New API Gateway Created" >> $GITHUB_STEP_SUMMARY
            echo "A new API Gateway was created with ID: \`${NEW_API_ID}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To switch traffic from the old API Gateway, run:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Delete old mapping" >> $GITHUB_STEP_SUMMARY
            echo "aws apigateway delete-base-path-mapping --domain-name api.vfs-tracker.app --base-path dev --region ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Create new mapping" >> $GITHUB_STEP_SUMMARY
            echo "aws apigateway create-base-path-mapping --domain-name api.vfs-tracker.app --rest-api-id ${NEW_API_ID} --stage dev --base-path dev --region ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
