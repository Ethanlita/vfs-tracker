name: Deploy to GitHub Pages

on:
  # 前端必须等待同一提交的后端工作流成功，避免新协议先于 Lambda 上线。
  workflow_run:
    workflows: ['Deploy Backend']
    types: [completed]
    branches: [master]

# 设置GITHUB_TOKEN权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过正在运行的队列
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_GEMINI_API: ${{ secrets.GOOGLE_GEMINI_API }}
      VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      VITE_COGNITO_USER_POOL_WEB_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_WEB_CLIENT_ID }}
      VITE_AWS_REGION: ${{ secrets.AWS_REGION }}
      VITE_API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
      VITE_API_STAGE: ${{ secrets.API_STAGE }}
      VITE_S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # workflow_run 默认可能检出较新的 master，必须固定到已验证的提交。
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 发布前先验证静态规则、完整单元测试和当前浏览器路径。
      - name: Lint source and tests
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run current-route browser tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list

      # 开发服务器不会注册 Service Worker，PWA 必须使用生产构建单独验收。
      - name: Run production PWA offline tests
        run: npm run test:e2e:pwa


      - name: Build project
        run: npm run build


      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-esa:
    name: Deploy ESA EdgeRoutine and purge .cn cache
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Alibaba Cloud CLI
        run: /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --region "cn-hangzhou"
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}

      - name: Deploy ESA EdgeRoutine
        run: node scripts/deploy-esa-routine.mjs
        env:
          ESA_ROUTINE_NAME: vfstrackercn
          ESA_ROUTINE_CODE: infra/esa-routine/cn-spa-fallback.js
          ESA_ROUTINE_ENV: production

      - name: Configure ESA compression
        run: node scripts/configure-esa-compression.mjs
        env:
          ESA_SITE_ID: '929690936461856'

      - name: Purge ESA entry cache
        run: node scripts/purge-esa-cache.mjs
        env:
          ESA_SITE_ID: '929690936461856'

      - name: Verify ESA compression
        run: node scripts/verify-esa-compression.mjs
