name: Build and Push Python Lambda Image

on:
  # 仅允许统一后端发布工作流调用，避免绕过 Node/SAM 质量门禁。
  workflow_call:
    outputs:
      image_uri:
        description: 由调用方在 SAM 成功后发布的不可变镜像地址
        value: ${{ jobs.build-and-push.outputs.image_uri }}

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: vfs-tracker-images
  # v2 管线依赖 filtered autocorrelation；稳定版 0.4.7 尚未提供该命令。
  # 固定源码提交比引用 90 天过期的外部 artifact 可重复。
  PARSELMOUTH_SOURCE_REPOSITORY: 'https://github.com/YannickJadoul/Parselmouth.git'
  PARSELMOUTH_SOURCE_COMMIT: '0a0594265823f5c3fdaa661a05c887cdf02ec143'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_uri: ${{ steps.image-uri.outputs.image_uri }}
    # 首次固定源码构建 Praat 较慢，后续由 BuildKit/GHA 缓存复用。
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./lambda-functions/online-praat-analysis
          platforms: linux/arm64
          push: true
          # provenance: false 防止生成 OCI attestation 清单，
          # AWS Lambda 不支持带有 attestation 的多架构镜像索引格式
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            PARSELMOUTH_SOURCE_REPOSITORY=${{ env.PARSELMOUTH_SOURCE_REPOSITORY }}
            PARSELMOUTH_SOURCE_COMMIT=${{ env.PARSELMOUTH_SOURCE_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image URI
        id: image-uri
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Output image info
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** latest, ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** linux/arm64 (native build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** pushed; the caller publishes the SHA tag after SAM succeeds" >> $GITHUB_STEP_SUMMARY
