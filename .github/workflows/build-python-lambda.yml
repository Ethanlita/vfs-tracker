name: Build and Push Python Lambda Image

on:
  # 仅允许统一后端发布工作流调用，避免绕过 Node/SAM 质量门禁。
  workflow_call:
    inputs:
      publish:
        description: 是否把通过测试的镜像推送到 ECR
        required: false
        default: false
        type: boolean
env:
  ECR_REPOSITORY: vfs-tracker-images
  # v2 管线依赖 filtered autocorrelation；稳定版 0.4.7 尚未提供该命令。
  # 固定源码提交比引用 90 天过期的外部 artifact 可重复。
  PARSELMOUTH_SOURCE_REPOSITORY: 'https://github.com/YannickJadoul/Parselmouth.git'
  PARSELMOUTH_SOURCE_COMMIT: '0a0594265823f5c3fdaa661a05c887cdf02ec143'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    # 首次固定源码构建 Praat 较慢，后续由 BuildKit/GHA 缓存复用。
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: inputs.publish
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./lambda-functions/online-praat-analysis
          platforms: linux/arm64
          push: ${{ inputs.publish }}
          # provenance: false 防止生成 OCI attestation 清单，
          # AWS Lambda 不支持带有 attestation 的多架构镜像索引格式
          provenance: false
          tags: |
            ${{ inputs.publish && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) || 'vfs-tracker-python:pr-check' }}
            ${{ inputs.publish && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY, github.sha) || format('vfs-tracker-python:pr-{0}', github.sha) }}
          build-args: |
            PARSELMOUTH_SOURCE_REPOSITORY=${{ env.PARSELMOUTH_SOURCE_REPOSITORY }}
            PARSELMOUTH_SOURCE_COMMIT=${{ env.PARSELMOUTH_SOURCE_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** linux/arm64 (native build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Published:** ${{ inputs.publish }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
